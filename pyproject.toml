[project]
name = "fusion-vlm"
version = "0.1.0"
description = "Edge VLM accuracy-efficiency study for person-down detection"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "pillow>=13.0.0",
    "psutil>=7.2.2",
    "requests>=2.34.2",
]

[project.optional-dependencies]
hf = [
    "accelerate>=1.15.0",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "transformers>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdvlm"]
